# Nginx in front of Klyve (PM2 runs the app on 127.0.0.1:3000).
# Live copy on the server: /etc/nginx/sites-available/klyve
#
# - klyveapp.tech         → the app (its main address since 2026-11-15)
# - www.klyveapp.tech     → redirect to klyveapp.tech
# - app.klyveapp.tech     → the OLD address (2026-11-14 to 15): redirect to
#   klyveapp.tech, EXCEPT addresses that live inside emails already sent and
#   in other people's systems (tracking, unsubscribe, preferences, view in
#   browser, sign-up forms, images, the email API and provider webhooks).
#   Those keep working on the old address so nothing out there breaks.
# - plain http:// (and the bare IP) → https://klyveapp.tech
#
# HTTPS: ONE Let's Encrypt certificate (certbot name "app.klyveapp.tech")
# covers klyveapp.tech, www and app. certbot.timer renews it by itself.
# After editing: sudo nginx -t && sudo systemctl reload nginx

# ── klyveapp.tech: the app ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name klyveapp.tech;

    ssl_certificate /etc/letsencrypt/live/app.klyveapp.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.klyveapp.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Image uploads are limited to 10 MB in the app; this is a safety net.
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Tell the app the real visitor (login/sign-up spam protection and
        # click/open tracking use the visitor's IP). Overwrite, never append,
        # so a visitor can't fake their IP with their own header.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Streaming pages and long requests.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}

# ── app.klyveapp.tech: old address ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.klyveapp.tech;

    ssl_certificate /etc/letsencrypt/live/app.klyveapp.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.klyveapp.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Links already out in the world keep working here (plus /_next/ for the
    # styles, scripts and fonts those few pages load).
    location ~ ^/(t|u|p|c|v|f|media|_next|api/(v1|unsubscribe|forms|webhooks))/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Everything else moves to the new address.
    location / {
        return 301 https://klyveapp.tech$request_uri;
    }
}

# ── www.klyveapp.tech → klyveapp.tech ────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.klyveapp.tech;

    ssl_certificate /etc/letsencrypt/live/app.klyveapp.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.klyveapp.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    return 301 https://klyveapp.tech$request_uri;
}

# ── Plain http:// (any name, or the bare IP) → https://klyveapp.tech ─────────
# http://app.klyveapp.tech keeps its path on the old https address, so an old
# http link still reaches the right place.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    if ($host = app.klyveapp.tech) {
        return 301 https://app.klyveapp.tech$request_uri;
    }
    return 301 https://klyveapp.tech$request_uri;
}
