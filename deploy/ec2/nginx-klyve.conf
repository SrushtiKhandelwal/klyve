# Nginx in front of Klyve (PM2 runs the app on 127.0.0.1:3000).
# server_name _ = answer on the bare IP for now. When the domain is connected,
# change it to app.klyveapp.tech and run certbot for HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Image uploads are limited to 10 MB in the app; this is a safety net.
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Tell the app the real visitor (login/sign-up spam protection and
        # click/open tracking use the visitor's IP).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Streaming pages and long requests.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
